<!--
  New tab favicon: a rounded square drawn as eight dashes of the same length, four on the
  corners (arcs) and four at the middle of the sides. 16-unit grid, stroke 2.5: the outer
  edge sits on the pixel grid (1 to 15). Path length 41.708, so one dash plus one gap is
  5.2135 (dash 3.4409, gap 1.7726); the offset centres a dash on each side middle.
  Colour #808080, readable on both the light and the dark default tab.
  Author: Rocco Casadei, a.k.a. Roccobot
-->
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <path d="M8 2.25 H11.25 A2.5 2.5 0 0 1 13.75 4.75 V11.25 A2.5 2.5 0 0 1 11.25 13.75 H4.75 A2.5 2.5 0 0 1 2.25 11.25 V4.75 A2.5 2.5 0 0 1 4.75 2.25 Z"
        fill="none" stroke="#808080" stroke-width="2.5"
        stroke-dasharray="3.4409 1.7726" stroke-dashoffset="1.7204"/>
</svg>
