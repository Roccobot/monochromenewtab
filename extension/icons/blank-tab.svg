<!--
  New tab favicon (1.03c): a white rounded square with eight dark dashes of the same length,
  four straight on the sides and four curved on the corners. 16 grid: dashes 2 px thick with
  their edges on whole pixels (1-3 and 13-15), so the white border is 1 px (2 px at 32).
  Side dashes run from 6 to 10, ends on whole pixels. Path length 44.5664: dash 4 plus gap
  1.5708; the corner dashes are 4 long too, mostly arc (radius 2). Dark #0f0f0f, white
  #ffffff, white corner radius 4, concentric with the dashes.
  Author: Rocco Casadei, a.k.a. Roccobot
-->
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <rect width="16" height="16" rx="4" fill="#ffffff"/>
  <path d="M8 2 H12 A2 2 0 0 1 14 4 V12 A2 2 0 0 1 12 14 H4 A2 2 0 0 1 2 12 V4 A2 2 0 0 1 4 2 Z" fill="none" stroke="#0f0f0f" stroke-width="2"
        stroke-dasharray="4 1.5708" stroke-dashoffset="2"/>
</svg>
