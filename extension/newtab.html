<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="colors.js"></script>
<meta name="color-scheme" content="light dark">
<title>New Tab</title>
<link rel="icon" type="image/svg+xml" href="icons/blank-tab.svg">
<!-- Inline, not a file: one request less before the first frame (MV3 limits scripts, not styles). -->
<style>
  html {
    height: 100%;
    background: var(--light);
  }
  @media (prefers-color-scheme: dark) {
    html {
      background: var(--dark);
    }
  }
</style>
</head>
<body></body>
</html>
